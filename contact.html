<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="contact.css" />
    <title>Contact Us</title>
  </head>
  <body>
    <header class="header">
      <nav class="bg-white shadow-md py-4">
        <div class="container mx-auto px-6 flex items-center justify-between">
          <!-- Logo -->
          <div class="logo">
            <a href="#">
              <img
                src="images/LOGO (1).png"
                alt=""
                class="w-[98px] h-auto"
                loading="lazy"
              />
            </a>
          </div>

          <!-- Desktop Nav -->
          <ul class="hidden lg:flex gap-8 font-medium whitespace-nowrap">
            <li><a href="index.html" class="hover:text-orange-600">HOME</a></li>
            <li>
              <a href="about.html" target="_blank" class="hover:text-orange-600"
                >ABOUT US</a
              >
            </li>
            <li>
              <a href="courses.html" class="hover:text-orange-600">COURSES</a>
            </li>
            <li><a href="#" class="hover:text-orange-600">INSTRUCTORS</a></li>
            <li>
              <a href="contact.html" class="hover:text-orange-600"
                >CONTACT US</a
              >
            </li>
          </ul>

          <!-- Desktop Button -->
          <div class="hidden lg:flex">
            <a href="#" class="nav-btn"> Get In Touch </a>
          </div>

          <!-- Hamburger -->
          <button id="navbar-toggle" class="lg:hidden text-2xl">
            <i class="fa-solid fa-bars"></i>
          </button>
        </div>
      </nav>

      <!-- Mobile Menu -->
      <div id="mobile-navbar" class="hidden fixed inset-0 bg-black/50 z-50">
        <div
          id="navbar-slide"
          class="w-64 h-full bg-white p-6 -translate-x-full transition-transform duration-300"
        >
          <ul class="flex flex-col gap-6 font-bold">
            <li><a href="index.html" class="hover:text-orange-600">HOME</a></li>
            <li>
              <a href="about.html" target="_blank" class="hover:text-orange-600"
                >ABOUT US</a
              >
            </li>
            <li><a href="#" class="hover:text-orange-600">COURSES</a></li>
            <li><a href="#" class="hover:text-orange-600">INSTRUCTORS</a></li>
            <li><a href="#" class="hover:text-orange-600">CONTACT US</a></li>
            <li>
              <a
                href="#"
                class="inline-block bg-orange-500 text-white px-5 py-2 rounded-lg"
              >
                Get In Touch
              </a>
            </li>
          </ul>
        </div>
      </div>
    </header>

    <!-- banner -->

    <section class="banner">
      <div class="custom-container"></div>
    </section>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
